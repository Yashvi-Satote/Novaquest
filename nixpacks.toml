# Root-level nixpacks.toml — used when Railway root directory is the repo root.
# It tells Nixpacks to look for Python requirements inside backend/.
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT"
