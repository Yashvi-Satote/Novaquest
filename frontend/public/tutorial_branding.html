<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaQuest - Outro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #0d1b3e 0%, #060a14 55%, #020408 100%);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas#stars {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .hud-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(79, 121, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 121, 255, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 2;
      pointer-events: none;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(2, 4, 8, 0.85) 100%);
      z-index: 3;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: zoomIn 4s cubic-bezier(0.1, 0, 0.2, 1) forwards;
    }
    @keyframes zoomIn {
      0% { transform: scale(0.95); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: scale(1.03); opacity: 1; }
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 24px;
      border-radius: 9999px;
      background: rgba(61, 107, 255, 0.12);
      border: 1px solid rgba(79, 121, 255, 0.4);
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(61, 107, 255, 0.2);
    }
    .logo-badge span {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: #8ce5ff;
      text-transform: uppercase;
    }
    h1.brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 96px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 
        0 0 20px rgba(61, 107, 255, 0.7),
        0 0 60px rgba(61, 107, 255, 0.4),
        0 0 100px rgba(61, 107, 255, 0.2);
      margin-bottom: 24px;
      line-height: 1;
    }
    .divider-line {
      width: 280px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4F79FF, #8ce5ff, #4F79FF, transparent);
      margin-bottom: 24px;
      box-shadow: 0 0 15px #3D6BFF;
    }
    p.brand-tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.45em;
      color: #8ce5ff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(140, 229, 255, 0.5);
      margin-bottom: 36px;
    }
    .hud-meta {
      display: flex;
      gap: 40px;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: #7f9fbe;
      text-transform: uppercase;
    }
    .hud-meta div {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ffaa;
      box-shadow: 0 0 12px #00ffaa;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    /* Corner brackets */
    .corner {
      position: absolute;
      width: 48px;
      height: 48px;
      border-color: rgba(79, 121, 255, 0.6);
      z-index: 10;
      pointer-events: none;
    }
    .corner-tl { top: 60px; left: 80px; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 60px; right: 80px; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 60px; left: 80px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 60px; right: 80px; border-bottom: 2px solid; border-right: 2px solid; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="hud-grid"></div>
  <div class="vignette"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="content">
    <div class="logo-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8ce5ff" stroke-width="2.5">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>INTERACTIVE SPACE EXPLORATION</span>
    </div>

    <h1 class="brand-title">NOVAQUEST</h1>
    
    <div class="divider-line"></div>

    <p class="brand-tagline">EXPLORE. DISCOVER. EXPERIENCE.</p>

    <div class="hud-meta">
      <div><span class="pulse-dot"></span> SYSTEM ONLINE</div>
      <div>MISSION ACTIVE // 2026</div>
      <div>HTTP://LOCALHOST:5173</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    const stars = [];
    for (let i = 0; i < 300; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.6 + 0.3,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2
      });
    }

    let t = 0;
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t += 0.02;

      stars.forEach(s => {
        const currentAlpha = s.alpha * (0.6 + 0.4 * Math.sin(t * s.speed * 50 + s.phase));
        ctx.fillStyle = `rgba(200, 225, 255, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
