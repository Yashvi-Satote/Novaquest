<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaQuest</title>
    <meta name="description" content="Searchable, interactive catalogue of human-made hardware sent into space, including satellites, spacecraft, landers, rovers, and probes." />
    <meta name="color-scheme" content="dark" />
    <link rel="preload" as="image" href="/videos/intro-poster.jpg" fetchpriority="high" />
    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&family=Share+Tech+Mono&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      #app-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #070b14;
        transition: opacity 200ms ease;
      }

      #app-loading-screen.app-loading-screen-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        color: #14d7df;
        font: 600 10px/1.5 system-ui, sans-serif;
        letter-spacing: 0.28em;
        text-align: center;
        text-transform: uppercase;
      }

      .app-loading-content svg {
        width: 48px;
        height: 48px;
        max-width: 48px;
        max-height: 48px;
        filter: drop-shadow(0 0 8px rgba(20, 215, 223, 0.65));
        animation: app-loading-spin 0.9s linear infinite;
      }

      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loading-screen { transition: none; }
        .app-loading-content svg { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#070b14] text-slate-100 antialiased" style="background-color: #070b14; color: #f1f5f9;">
    <div id="app-loading-screen" role="status" aria-live="polite" aria-label="Loading NovaQuest">
      <div class="app-loading-content">
        <svg viewBox="0 0 40 40" width="48" height="48" aria-hidden="true">
          <circle cx="20" cy="4" r="2.2" fill="#14d7df" />
          <circle cx="28" cy="6.1" r="2.1" fill="#14d7df" opacity=".92" />
          <circle cx="33.9" cy="12" r="2" fill="#14d7df" opacity=".84" />
          <circle cx="36" cy="20" r="1.9" fill="#14d7df" opacity=".76" />
          <circle cx="33.9" cy="28" r="1.8" fill="#14d7df" opacity=".68" />
          <circle cx="28" cy="33.9" r="1.7" fill="#14d7df" opacity=".6" />
          <circle cx="20" cy="36" r="1.6" fill="#14d7df" opacity=".52" />
          <circle cx="12" cy="33.9" r="1.5" fill="#14d7df" opacity=".44" />
          <circle cx="6.1" cy="28" r="1.4" fill="#14d7df" opacity=".36" />
          <circle cx="4" cy="20" r="1.3" fill="#14d7df" opacity=".28" />
          <circle cx="6.1" cy="12" r="1.2" fill="#14d7df" opacity=".2" />
          <circle cx="12" cy="6.1" r="1.1" fill="#14d7df" opacity=".12" />
        </svg>
        <span>Preparing mission control</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
